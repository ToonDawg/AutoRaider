# configs/arena_v2.yaml
name: "Arena - classic battles until tokens run out"
start_node: close_popup_ads

# on_failure is omitted where a failure means the bot is lost.
# An omitted edge is null, which ends the run as ABORTED.
#
# Repetition is a cycle in this graph, not a counter: return_to_opponent_list
# feeds back into select_opponent, and check_out_of_tokens is the only clean way
# out. The runner caps a run at max_steps (200), so a cycle that never finds its
# exit ends as STEP_LIMIT with a crash dump rather than spinning forever.

nodes:
  close_popup_ads:
    action: CLICK_IMAGE
    target: exitAdd.png
    settle_seconds: 3
    note: "Best effort - no ad on screen is the normal case, so both edges continue."
    on_success: open_battle_menu
    on_failure: open_battle_menu

  open_battle_menu:
    action: CLICK_IMAGE
    target: battleBTN.png
    settle_seconds: 1
    on_success: open_arena_tab

  open_arena_tab:
    action: CLICK_IMAGE
    target: arenaTab.png
    settle_seconds: 1
    on_success: enter_classic_arena

  enter_classic_arena:
    action: CLICK_IMAGE
    target: classicArena.png
    settle_seconds: 2
    on_success: select_opponent

  select_opponent:
    action: CLICK_IMAGE
    target: arenaBattle.png
    settle_seconds: 2
    ignore_visited: true
    note: >-
      Clicks the best single match. v1 clicked every visible Battle button. Also
      the loop's re-entry point. If no match is found, we scroll to reveal more.
    on_success: start_battle
    on_failure: swipe_to_reveal_teams

  swipe_to_reveal_teams:
    action: SWIPE
    target: up
    distance: 400
    duration: 0.5
    settle_seconds: 1
    note: >-
      Scrolls the opponent list to reveal the bottom half (swipe up drags the screen content up).
    on_success: correct_swipe_overshoot

  correct_swipe_overshoot:
    action: SWIPE
    target: down
    distance: 30
    duration: 2.0
    settle_seconds: 2
    note: "v1 performs a small downward swipe to settle the scroll."
    on_success: select_opponent_bottom

  select_opponent_bottom:
    action: CLICK_IMAGE
    target: arenaBattle.png
    settle_seconds: 2
    ignore_visited: true
    note: >-
      Clicks a match on the bottom half. If exhausted, try to refresh.
    on_success: start_battle
    on_failure: refresh_opponents

  refresh_opponents:
    action: CLICK_IMAGE
    target: arenaRefresh.png
    settle_seconds: 2
    clear_visited: true
    note: >-
      Clicks the refresh button if available. If on cooldown (not found),
      we exit cleanly.
    on_success: select_opponent
    on_failure: exit_cleanly

  start_battle:
    action: CLICK_IMAGE
    target: arenaStart.png
    settle_seconds: 2
    note: >-
      Clicks start. This either begins the battle, OR triggers a token refill popup.
    on_success: check_free_refill
    on_failure: abort_hung_team

  abort_hung_team:
    action: PRESS_KEY
    target: esc
    settle_seconds: 2
    note: "If start button is missing, skip the team and return to list."
    on_success: select_opponent

  check_free_refill:
    action: CLICK_IMAGE
    target: arenaConfirm.png
    settle_seconds: 1
    note: >-
      Check for the 'Confirm' button on the free refill popup and click it.
      If it's found and clicked, loop back to start_battle.
      If not found, we either have the gems popup or we are loading into battle.
    on_success: start_battle
    on_failure: check_gems_refill

  check_gems_refill:
    action: IMAGE_PRESENT
    target: ArenaRefillGems.png
    note: >-
      If no confirm button, check if it's the Gems refill popup (which we want to escape).
      If neither popup is found, we assume the battle started.
    on_success: leave_refill_prompt
    on_failure: await_battle_end

  leave_refill_prompt:
    action: PRESS_KEY
    target: esc
    settle_seconds: 1
    on_success: null

  await_battle_end:
    action: WAIT_FOR_IMAGE
    target: tapToContinue.png
    timeout_seconds: 120
    check_interval_seconds: 2
    note: "Battle end is detected by tapToContinue appearing. There is no victory or defeat detection in v1."
    on_success: dismiss_results

  dismiss_results:
    action: CLICK_IMAGE
    target: tapToContinue.png
    settle_seconds: 1
    on_success: return_to_opponent_list

  return_to_opponent_list:
    action: PRESS_KEY
    target: esc
    settle_seconds: 2
    note: >-
      Closes the loop. Back on the opponent list, fight again; tokens are what
      stop us, not a count.
    on_success: select_opponent

  exit_cleanly:
    action: PRESS_KEY
    target: esc
    settle_seconds: 1
    note: "Harmless ESC to exit cleanly (outcome=COMPLETED) so we don't crash dump on exhaustion."
    on_success: null
